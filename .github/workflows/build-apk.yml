name: Build AqroMeslehet APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses and install SDK 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error title=SDK Error::sdkmanager not found in $SDK_DIR"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if ! "$SDKMANAGER" "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" > sdk-install.log 2>&1; then
            cat sdk-install.log
            ERR_LINE="$(tail -n 10 sdk-install.log | tr '\r' ' ' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=SDK Install Failed::$ERR_LINE"
            exit 1
          fi

      - name: Prepare debug keystore and env defaults
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            python3 - <<'PY'
          import base64, json, os, re, sys
          raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if not raw:
              sys.exit(0)
          content = None
          if raw.startswith("{"):
              content = raw
          else:
              try:
                  decoded = base64.b64decode("".join(raw.split())).decode("utf-8", errors="replace").strip()
                  if decoded.startswith("{"):
                      content = decoded
              except Exception:
                  content = None
          if not content:
              print("::warning title=Invalid GOOGLE_SERVICES_JSON::Secret GOOGLE_SERVICES_JSON is neither valid JSON nor base64-encoded JSON.")
              sys.exit(0)
          # Normalize smart quotes and strip ASCII control chars that break strict JSON parsers when copied on mobile
          cleaned = (
              content.lstrip("\ufeff")
              .replace("\u201c", '"')
              .replace("\u201d", '"')
              .replace("\u2018", "'")
              .replace("\u2019", "'")
          )
          cleaned = re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f]", "", cleaned)
          parsed = None
          for candidate, strict_mode in ((content, True), (cleaned, False), (re.sub(r"[\r\n\t]+", " ", cleaned), False)):
              try:
                  parsed = json.loads(candidate, strict=strict_mode)
                  break
              except Exception as exc:
                  last_exc = exc
          if parsed is None:
              print(f"::warning title=Invalid GOOGLE_SERVICES_JSON::JSON parse failed: {last_exc}")
              sys.exit(0)
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(parsed, f, indent=2)
          print("Created app/google-services.json from GOOGLE_SERVICES_JSON secret.")
          clients = parsed.get("client", [])
          if any(c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.aistudio.testbaza.app" for c in clients):
              with open("testbaza/google-services.json", "w", encoding="utf-8") as tf:
                  json.dump(parsed, tf, indent=2)
              print("Synced testbaza/google-services.json from GOOGLE_SERVICES_JSON secret.")
          PY
          elif [ ! -f app/google-services.json ]; then
            echo "::warning title=Missing google-services.json::app/google-services.json was not found in the repository and GOOGLE_SERVICES_JSON secret is not set. Add GOOGLE_SERVICES_JSON in GitHub Settings -> Secrets and variables -> Actions (or upload app/google-services.json) so Firebase and Google Sign-In work."
          fi
          if [ ! -f .env.example ]; then
            echo "# placeholder" > .env.example
          fi
          KEYSTORE_SOURCE="repo-debug.keystore.base64"
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            KEYSTORE_SOURCE="ephemeral-generated"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          KEYTOOL_OUT="$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null || true)"
          APK_SHA1="$(printf '%s\n' "$KEYTOOL_OUT" | sed -n 's/.*SHA1:[[:space:]]*\([0-9A-Fa-f:]\{59\}\).*/\1/p' | head -n 1 | tr 'a-f' 'A-F')"
          APK_SHA256="$(printf '%s\n' "$KEYTOOL_OUT" | sed -n 's/.*SHA256:[[:space:]]*\([0-9A-Fa-f:]\{95\}\).*/\1/p' | head -n 1 | tr 'a-f' 'A-F')"
          {
            echo "### AqroMeslehet APK Signing & Firebase Check"
            echo "- **Package Name:** \`com.aistudio.aqromeslehet.vqrban\`"
            echo "- **Keystore Source:** \`$KEYSTORE_SOURCE\`"
            echo "- **SHA-1:** \`${APK_SHA1:-unknown}\`"
            echo "- **SHA-256:** \`${APK_SHA256:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$KEYSTORE_SOURCE" = "ephemeral-generated" ]; then
            echo "::warning title=Missing debug.keystore.base64::debug.keystore.base64 was missing so a new SHA-1 (${APK_SHA1}) was generated. Commit debug.keystore.base64 or add this SHA-1 in Firebase Console."
          fi
          if [ -f app/google-services.json ] && [ -n "$APK_SHA1" ]; then
            APK_SHA1="$APK_SHA1" APK_SHA256="$APK_SHA256" python3 - <<'PY'
          import json, os
          sha1_colon = os.environ.get("APK_SHA1", "").upper()
          sha1_plain = sha1_colon.replace(":", "").lower()
          sha256_colon = os.environ.get("APK_SHA256", "").upper()
          try:
              data = json.load(open("app/google-services.json", encoding="utf-8"))
          except Exception as exc:
              print(f"::warning title=Invalid app/google-services.json::{exc}")
              raise SystemExit(0)
          pkg = "com.aistudio.aqromeslehet.vqrban"
          clients = data.get("client", [])
          matched_client = None
          for c in clients:
              p = c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              if p == pkg:
                  matched_client = c
                  break
          if not matched_client:
              print(f"::warning title=Firebase Package Mismatch::app/google-services.json does not contain package {pkg}.")
          else:
              oauth = matched_client.get("oauth_client", [])
              cert_hashes = [o.get("android_info", {}).get("certificate_hash", "").lower() for o in oauth if o.get("client_type") == 1]
              has_web_client = any(o.get("client_type") == 3 and o.get("client_id") for o in oauth)
              if sha1_plain not in cert_hashes:
                  print(f"::warning title=Firebase SHA-1 Mismatch::APK SHA-1 ({sha1_colon}) is NOT in app/google-services.json {cert_hashes}. Add SHA-1 ({sha1_colon}) and SHA-256 ({sha256_colon}) in Firebase Console -> Project Settings -> Your Android App, then update GOOGLE_SERVICES_JSON.")
              if not has_web_client:
                  print("::warning title=Missing Google Sign-In Web Client::oauth_client client_type=3 is missing in app/google-services.json. Enable Authentication -> Sign-in method -> Google in Firebase Console and re-download google-services.json.")
          PY
          fi


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build AqroMeslehet, TNT & Testbaza APKs
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug :texnonezaret:assembleDebug :testbaza:assembleDebug \
            -PactiveApp=aqromeslehet \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            --stacktrace 2>&1 | tee build-debug.log; then
            echo "=== FAILURE SUMMARY ==="
            ERR_LINES="$(grep -E "^e: |Unresolved reference" build-debug.log | head -n 15)"
            FAIL_BLOCK="$(grep -A 10 "FAILURE: Build failed" build-debug.log | head -n 12)"
            SUMMARY="$(printf '%s\n%s' "$ERR_LINES" "$FAIL_BLOCK" | sed '/^$/d')"
            if [ -z "$SUMMARY" ]; then
              SUMMARY="$(tail -n 25 build-debug.log)"
            fi
            echo "$SUMMARY"
            ESCAPED="$(printf '%s' "$SUMMARY" | tr '\r' ' ' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Gradle Build Failed::$ESCAPED"
            exit 1
          fi

      - name: Upload AqroMeslehet APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AqroMeslehet-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload TNT Offline APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TNT-APK
          path: texnonezaret/build/outputs/apk/debug/texnonezaret-debug.apk
          if-no-files-found: error

      - name: Upload Testbaza APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Testbaza-APK
          path: testbaza/build/outputs/apk/debug/testbaza-debug.apk
          if-no-files-found: error
