name: Build AqroMeslehet APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses and install SDK 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error title=SDK Error::sdkmanager not found in $SDK_DIR"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if ! "$SDKMANAGER" "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" > sdk-install.log 2>&1; then
            cat sdk-install.log
            ERR_LINE="$(tail -n 10 sdk-install.log | tr '\r' ' ' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=SDK Install Failed::$ERR_LINE"
            exit 1
          fi

      - name: Prepare debug keystore and env defaults
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            python3 - <<'PY'
          import base64, json, os, sys
          raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if not raw:
              sys.exit(0)
          content = None
          if raw.startswith("{"):
              content = raw
          else:
              try:
                  decoded = base64.b64decode("".join(raw.split())).decode("utf-8").strip()
                  if decoded.startswith("{"):
                      content = decoded
              except Exception:
                  content = None
          if not content:
              print("::warning title=Invalid GOOGLE_SERVICES_JSON::Secret GOOGLE_SERVICES_JSON is neither valid JSON nor base64-encoded JSON.")
              sys.exit(0)
          try:
              parsed = json.loads(content)
          except Exception as exc:
              print(f"::warning title=Invalid GOOGLE_SERVICES_JSON::JSON parse failed: {exc}")
              sys.exit(0)
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(parsed, f, indent=2)
          print("Created app/google-services.json from GOOGLE_SERVICES_JSON secret.")
          PY
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning title=Missing google-services.json::app/google-services.json was not found in the repository and GOOGLE_SERVICES_JSON secret is not set. Add GOOGLE_SERVICES_JSON in GitHub Settings -> Secrets and variables -> Actions (or upload app/google-services.json) so Firebase and Google Sign-In work."
          fi
          if [ ! -f .env.example ]; then
            echo "# placeholder" > .env.example
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            --stacktrace 2>&1 | tee build-debug.log; then
            echo "=== FAILURE SUMMARY ==="
            ERR_LINES="$(grep -E "^e: |Unresolved reference" build-debug.log | head -n 15)"
            FAIL_BLOCK="$(grep -A 10 "FAILURE: Build failed" build-debug.log | head -n 12)"
            SUMMARY="$(printf '%s\n%s' "$ERR_LINES" "$FAIL_BLOCK" | sed '/^$/d')"
            if [ -z "$SUMMARY" ]; then
              SUMMARY="$(tail -n 25 build-debug.log)"
            fi
            echo "$SUMMARY"
            ESCAPED="$(printf '%s' "$SUMMARY" | tr '\r' ' ' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Gradle Build Failed::$ESCAPED"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AqroMeslehet-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
